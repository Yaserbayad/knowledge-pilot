name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  release-prep:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/comprehensive-hardening' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/comprehensive-hardening
          fetch-depth: 0
      - id: gate
        name: Check one-time release marker
        run: |
          if [ -f .github/release-prep-trigger ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Apply release identity
        if: steps.gate.outputs.apply == 'true'
        run: |
          npm version 1.4.2 --no-git-tag-version --ignore-scripts
          printf '1.4.2\n' > VERSION
          node <<'NODE'
          const fs = require('node:fs');
          const versionFile = 'src/version.js';
          const versionSource = fs.readFileSync(versionFile, 'utf8');
          const nextVersionSource = versionSource.replace(/export const APP_VERSION = '[^']+';/, "export const APP_VERSION = '1.4.2';");
          if (nextVersionSource === versionSource) throw new Error('APP_VERSION replacement did not apply');
          fs.writeFileSync(versionFile, nextVersionSource);

          const swFile = 'public/sw.js';
          const swSource = fs.readFileSync(swFile, 'utf8');
          const nextSwSource = swSource.replace(/knowledge-pilot-shell-v\d+\.\d+\.\d+/, 'knowledge-pilot-shell-v1.4.2');
          if (nextSwSource === swSource) throw new Error('service worker cache replacement did not apply');
          fs.writeFileSync(swFile, nextSwSource);
          NODE
          cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable Knowledge Pilot changes are documented here. Versions follow Semantic Versioning.

          ## [1.4.2] - 2026-08-21

          ### Security
          - Hardened authenticated browser mutations, security headers/CSP, request-size enforcement, request logging, private file containment, channel binding, and outbound SSRF/DNS-rebinding protections.
          - Added bounded streaming response handling across research, AI/provider, Knowledge Pilot bridge, and Workspace Agent requests.
          - Hardened production configuration validation and deployment credential guidance.

          ### Fixed
          - Made JSON state publication fail closed when persistence fails and reject unsupported future schemas.
          - Prevented ambiguous external deliveries and Workspace Agent triggers from being blindly duplicated after uncertain outcomes.
          - Made accepted verified-processing results and terminal task state atomic, retired superseded work, and removed redundant full accepted-result retention.
          - Prevented completed lesson/book progress regression and invalid book/session state transitions.
          - Closed owned-book path traversal/symlink escape and WhatsApp account-binding ownership gaps.
          - Fixed strict-CSP frontend progress rendering and unified accessible dialog focus/Escape/Tab behavior.
          - Fixed Workspace Agent empty-queue reconciliation so a claimed queue cannot clear an active run before its documented beta run status is checked.

          ### Changed
          - Expanded regression coverage for persistence, HTTP security, scheduling, result contracts, books, frontend runtime behavior, Workspace Agent safety, and deployment invariants.
          - Made aaPanel release preparation fail closed, reproducible, and process-manager-neutral.
          - Replaced hard-coded Workspace Agent Node paths with the actual installer runtime binary.
          - Replaced legacy moving-package deployment instructions with an immutable tag/SHA staging, cutover, smoke, and rollback runbook.

          ### Compatibility
          - No state-schema bump and no intentional breaking learner/admin or verified-processing API change from 1.4.1.
          EOF
      - name: Verify exact release scope
        if: steps.gate.outputs.apply == 'true'
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "CHANGELOG.md VERSION package-lock.json package.json public/sw.js src/version.js "
      - name: Verify full application and dependency audit
        if: steps.gate.outputs.apply == 'true'
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Verify Workspace Agent and dependency audit
        if: steps.gate.outputs.apply == 'true'
        working-directory: automation/workspace-agent
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Commit verified release preparation
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md VERSION package.json package-lock.json public/sw.js src/version.js
          git rm .github/release-prep-trigger
          git diff --cached --check
          git commit -m 'chore: prepare Knowledge Pilot 1.4.2 release [release-prep]'
          git push origin HEAD:audit/comprehensive-hardening

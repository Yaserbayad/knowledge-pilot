name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  frontend-runtime-repair:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/comprehensive-hardening' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Check one-time repair marker
        run: |
          if [ -f .github/frontend-runtime-repair-trigger ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Apply CSP-safe styles and dialog lifecycle
        if: steps.gate.outputs.apply == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('public/app.js')
          admin_path = Path('public/admin.js')
          css_path = Path('public/styles.css')
          app = app_path.read_text()
          admin = admin_path.read_text()
          css = css_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor count was {text.count(old)}, expected 1')
              return text.replace(old, new, 1)

          helper_anchor = "function clearError() { $('#error').classList.add('hidden'); }\n\nfunction showToast(message) {"
          helper_block = """function clearError() { $('#error').classList.add('hidden'); }

          function openDialogSurface(html, { labelId = 'dialog-title', initialFocus = '[autofocus], #close-dialog, button, a[href], input, textarea, select' } = {}) {
            const dialog = $('#dialog');
            const previous = document.activeElement;
            dialog.innerHTML = html;
            dialog.setAttribute('aria-labelledby', labelId);
            dialog.classList.remove('hidden');
            const close = () => {
              dialog.classList.add('hidden');
              dialog.innerHTML = '';
              dialog.removeAttribute('aria-labelledby');
              dialog.onclick = null;
              dialog.onkeydown = null;
              previous?.focus?.();
            };
            dialog.onclick = (event) => { if (event.target === dialog) close(); };
            dialog.onkeydown = (event) => {
              if (event.key === 'Escape') { event.preventDefault(); close(); return; }
              if (event.key === 'Tab') {
                const focusable = [...dialog.querySelectorAll('button, a[href], input, textarea, select, [tabindex]:not([tabindex="-1"])')]
                  .filter((item) => !item.disabled && !item.hidden && item.getAttribute('aria-hidden') !== 'true');
                if (!focusable.length) { event.preventDefault(); return; }
                const first = focusable[0];
                const last = focusable.at(-1);
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
              }
            };
            dialog.querySelector(initialFocus)?.focus();
            return { dialog, close };
          }

          function clampProgress(value) { return Math.max(0, Math.min(100, Number(value) || 0)); }
          function applyDynamicStyles(root = document) {
            root.querySelectorAll('[data-progress-inline]').forEach((item) => { item.style.inlineSize = `${clampProgress(item.dataset.progressInline)}%`; });
            root.querySelectorAll('[data-progress-width]').forEach((item) => { item.style.width = `${clampProgress(item.dataset.progressWidth)}%`; });
          }
          const dynamicStyleObserver = new MutationObserver(() => applyDynamicStyles());
          dynamicStyleObserver.observe(document.documentElement, { childList: true, subtree: true });

          function showToast(message) {"""
          app = replace_once(app, helper_anchor, helper_block, 'learner dialog helper')

          schedule_old = """function openScheduleDialog(kind, id, currentAt = '') {
            const dialog = $('#dialog');
            const endpoint = kind === 'book' ? '/api/book-sessions' : '/api/lessons';
            const suggested = currentAt ? new Date(currentAt) : new Date(Date.now() + 5 * 60_000);
            const localValue = new Date(suggested.getTime() - suggested.getTimezoneOffset() * 60_000).toISOString().slice(0, 16);
            dialog.classList.remove('hidden');
            dialog.innerHTML = `<div class="card"><div class="dialog-heading"><h2>Choose delivery time</h2><button type="button" class="icon-button ghost" id="close-dialog" aria-label="Close">×</button></div><form id="schedule-form"><label>Delivery date and time<input type="datetime-local" name="runAt" value="${esc(localValue)}" required></label><div class="actions dialog-actions"><button>Save schedule</button><button type="button" class="ghost" id="deliver-immediately">Deliver now</button></div></form></div>`;
            const close = () => dialog.classList.add('hidden');
          """
          schedule_new = """function openScheduleDialog(kind, id, currentAt = '') {
            const endpoint = kind === 'book' ? '/api/book-sessions' : '/api/lessons';
            const suggested = currentAt ? new Date(currentAt) : new Date(Date.now() + 5 * 60_000);
            const localValue = new Date(suggested.getTime() - suggested.getTimezoneOffset() * 60_000).toISOString().slice(0, 16);
            const { close } = openDialogSurface(`<div class="card"><div class="dialog-heading"><h2 id="dialog-title">Choose delivery time</h2><button type="button" class="icon-button ghost" id="close-dialog" aria-label="Close">×</button></div><form id="schedule-form"><label>Delivery date and time<input type="datetime-local" name="runAt" value="${esc(localValue)}" required></label><div class="actions dialog-actions"><button>Save schedule</button><button type="button" class="ghost" id="deliver-immediately">Deliver now</button></div></form></div>`, { initialFocus: 'input[name="runAt"]' });
          """
          app = replace_once(app, schedule_old, schedule_new, 'schedule dialog')

          sheet_pattern = re.compile(r"function openAccessibleSheet\(title, body, bind = \(\) => \{\}\) \{.*?\n\}\n\nfunction openOutlineSheet", re.S)
          sheet_new = """function openAccessibleSheet(title, body, bind = () => {}) {
            const { dialog, close } = openDialogSurface(`<div class="card lesson-sheet" role="document"><div class="dialog-heading"><h2 id="dialog-title">${esc(title)}</h2><button type="button" class="icon-button ghost" id="close-dialog" aria-label="Close">×</button></div>${body}</div>`);
            $('#close-dialog').onclick = close;
            bind(dialog, close);
          }

          function openOutlineSheet"""
          app, count = sheet_pattern.subn(sheet_new, app, count=1)
          if count != 1:
              raise SystemExit(f'accessible sheet replacement count {count}')

          question_old = """function openQuestionDialog(lesson, starter = '') {
            const dialog = $('#dialog');
            dialog.classList.remove('hidden');
            dialog.innerHTML = `<div class="card"><div class="dialog-heading"><h2>${esc(uiText(lesson, 'discussTitle'))}</h2><button type="button" class="icon-button ghost" id="close-dialog" aria-label="Close">×</button></div><form id="question-form"><label>${esc(uiText(lesson, 'questionLabel'))}<textarea name="question" dir="auto" required autofocus>${esc(starter)}</textarea></label><p class="muted">${esc(uiText(lesson, 'aiProcessing'))}</p><div class="actions dialog-actions"><button>${esc(uiText(lesson, 'ask'))}</button><button type="button" class="ghost" id="cancel-dialog">${esc(uiText(lesson, 'cancel'))}</button></div></form><div id="question-answer"></div></div>`;
            const close = () => dialog.classList.add('hidden');
          """
          question_new = """function openQuestionDialog(lesson, starter = '') {
            const { close } = openDialogSurface(`<div class="card"><div class="dialog-heading"><h2 id="dialog-title">${esc(uiText(lesson, 'discussTitle'))}</h2><button type="button" class="icon-button ghost" id="close-dialog" aria-label="Close">×</button></div><form id="question-form"><label>${esc(uiText(lesson, 'questionLabel'))}<textarea name="question" dir="auto" required autofocus>${esc(starter)}</textarea></label><p class="muted">${esc(uiText(lesson, 'aiProcessing'))}</p><div class="actions dialog-actions"><button>${esc(uiText(lesson, 'ask'))}</button><button type="button" class="ghost" id="cancel-dialog">${esc(uiText(lesson, 'cancel'))}</button></div></form><div id="question-answer"></div></div>`, { initialFocus: 'textarea[name="question"]' });
          """
          app = replace_once(app, question_old, question_new, 'question dialog')

          book_question_old = """  if ($('#ask-book-question')) $('#ask-book-question').onclick = () => {
            const dialog = $('#dialog'); dialog.classList.remove('hidden');
            dialog.innerHTML = `<div class="card"><div class="dialog-heading"><h2>Ask about this book session</h2><button type="button" class="icon-button ghost" id="close-dialog">×</button></div><form id="book-question-form"><label>Question<textarea name="question" dir="auto" required autofocus></textarea></label><div class="actions dialog-actions"><button>Ask</button></div></form><div id="book-question-answer"></div></div>`;
            $('#close-dialog').onclick = () => dialog.classList.add('hidden');
          """
          book_question_new = """  if ($('#ask-book-question')) $('#ask-book-question').onclick = () => {
            const { close } = openDialogSurface(`<div class="card"><div class="dialog-heading"><h2 id="dialog-title">Ask about this book session</h2><button type="button" class="icon-button ghost" id="close-dialog" aria-label="Close">×</button></div><form id="book-question-form"><label>Question<textarea name="question" dir="auto" required autofocus></textarea></label><div class="actions dialog-actions"><button>Ask</button></div></form><div id="book-question-answer"></div></div>`, { initialFocus: 'textarea[name="question"]' });
            $('#close-dialog').onclick = close;
          """
          app = replace_once(app, book_question_old, book_question_new, 'book question dialog')

          app_replacements = [
            ('<span style="inline-size:${Number(lesson.resumePercent)}%"></span>', '<span data-progress-inline="${Number(lesson.resumePercent)}"></span>'),
            ('<span style="inline-size:${progress}%"></span>', '<span data-progress-inline="${progress}"></span>'),
            ('<div class="progress-fill" style="width:${Number(book.progressPercent || 0)}%"></div>', '<div class="progress-fill" data-progress-width="${Number(book.progressPercent || 0)}"></div>')
          ]
          expected_counts = [1, 1, 3]
          for (old, new), expected in zip(app_replacements, expected_counts):
              actual = app.count(old)
              if actual != expected:
                  raise SystemExit(f'progress style anchor count {actual}, expected {expected}: {old}')
              app = app.replace(old, new)

          if re.search(r'\sstyle\s*=\s*["\']', app, flags=re.I):
              raise SystemExit('learner asset still emits inline style attributes')

          admin_helper_anchor = "function fmt(date) { return date ? new Date(date).toLocaleString() : '—'; }\n\nasync function checkSession() {"
          admin_helper_block = """function fmt(date) { return date ? new Date(date).toLocaleString() : '—'; }

          function openDialogSurface(html, { labelId = 'dialog-title', initialFocus = '[autofocus], #close, button, a[href], input, textarea, select' } = {}) {
            const dialog = $('#dialog');
            const previous = document.activeElement;
            dialog.innerHTML = html;
            dialog.setAttribute('aria-labelledby', labelId);
            dialog.classList.remove('hidden');
            const close = () => {
              dialog.classList.add('hidden');
              dialog.innerHTML = '';
              dialog.removeAttribute('aria-labelledby');
              dialog.onclick = null;
              dialog.onkeydown = null;
              previous?.focus?.();
            };
            dialog.onclick = (event) => { if (event.target === dialog) close(); };
            dialog.onkeydown = (event) => {
              if (event.key === 'Escape') { event.preventDefault(); close(); return; }
              if (event.key === 'Tab') {
                const focusable = [...dialog.querySelectorAll('button, a[href], input, textarea, select, [tabindex]:not([tabindex="-1"])')]
                  .filter((item) => !item.disabled && !item.hidden && item.getAttribute('aria-hidden') !== 'true');
                if (!focusable.length) { event.preventDefault(); return; }
                const first = focusable[0];
                const last = focusable.at(-1);
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
              }
            };
            dialog.querySelector(initialFocus)?.focus();
            return { dialog, close };
          }

          async function checkSession() {"""
          admin = replace_once(admin, admin_helper_anchor, admin_helper_block, 'admin dialog helper')

          source_old = """  const d = $('#dialog'); d.classList.remove('hidden');
            d.innerHTML = `<div class="card"><h2>Generate researched lesson</h2><p class="muted">Optional: add trusted source URLs, one per line. SearXNG results are also used when configured.</p><form id="source-form"><label>Source URLs<textarea name="urls"></textarea></label><div class="actions" style="margin-top:12px"><button>Generate</button><button type="button" class="ghost" id="close">Cancel</button></div></form><div id="generation-status"></div></div>`;
            $('#close').onclick = () => d.classList.add('hidden');
            $('#source-form').onsubmit = async (event) => { event.preventDefault(); const btn = event.target.querySelector('button'); btn.disabled = true; $('#generation-status').innerHTML = '<p class="notice">Generating and checking the lesson…</p>'; try { const urls = String(new FormData(event.target).get('urls') || '').split(/\\s+/).filter(Boolean); await api(`/api/admin/plans/${planId}/generate/${proposalId}`, { method: 'POST', body: JSON.stringify({ sourceUrls: urls }) }); d.classList.add('hidden'); await refresh(); } catch (e) { $('#generation-status').innerHTML = `<p class="notice error">${esc(e.message)}</p>`; } finally { btn.disabled = false; } };
          """
          source_new = """  const { close } = openDialogSurface(`<div class="card"><h2 id="dialog-title">Generate researched lesson</h2><p class="muted">Optional: add trusted source URLs, one per line. SearXNG results are also used when configured.</p><form id="source-form"><label>Source URLs<textarea name="urls"></textarea></label><div class="actions admin-dialog-actions"><button>Generate</button><button type="button" class="ghost" id="close" aria-label="Close">Cancel</button></div></form><div id="generation-status"></div></div>`, { initialFocus: 'textarea[name="urls"]' });
            $('#close').onclick = close;
            $('#source-form').onsubmit = async (event) => { event.preventDefault(); const btn = event.target.querySelector('button'); btn.disabled = true; $('#generation-status').innerHTML = '<p class="notice">Generating and checking the lesson…</p>'; try { const urls = String(new FormData(event.target).get('urls') || '').split(/\\s+/).filter(Boolean); await api(`/api/admin/plans/${planId}/generate/${proposalId}`, { method: 'POST', body: JSON.stringify({ sourceUrls: urls }) }); close(); await refresh(); } catch (e) { $('#generation-status').innerHTML = `<p class="notice error">${esc(e.message)}</p>`; } finally { btn.disabled = false; } };
          """
          admin = replace_once(admin, source_old, source_new, 'admin source dialog')

          preview_lesson_pattern = re.compile(r"function previewLesson\(l\) \{.*?\n\}\n\n\nfunction renderBooksAdmin", re.S)
          preview_lesson_new = """function previewLesson(l) {
            const c = l.content || {};
            const { close } = openDialogSurface(`<div class="card"><div class="actions">${badge(l.status)}<button class="ghost" id="close" aria-label="Close">Close</button></div><h2 id="dialog-title">${esc(l.title)}</h2><p><strong>${esc(l.question)}</strong></p><p>${esc(c.hook)}</p><h3>Core</h3><p>${esc(c.coreExplanation)}</p><h3>Three ideas</h3><ol>${(c.keyIdeas || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ol><h3>Sources</h3><ol>${(l.sources || []).map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></li>`).join('')}</ol></div>`);
            $('#close').onclick = close;
          }


          function renderBooksAdmin"""
          admin, count = preview_lesson_pattern.subn(preview_lesson_new, admin, count=1)
          if count != 1:
              raise SystemExit(f'admin lesson preview replacement count {count}')

          preview_book_pattern = re.compile(r"function previewBookSession\(session\) \{.*?\n\}\n\nfunction renderChannels", re.S)
          preview_book_new = """function previewBookSession(session) {
            const book = state.books.find((item) => item.id === session.bookId);
            const content = session.content || {};
            const { close } = openDialogSurface(`<div class="card"><div class="actions">${badge(session.status)}${badge(session.reviewStatus)}<button class="ghost" id="close" aria-label="Close">Close</button></div><div class="kicker">${esc(book?.title || 'Book')} · Session ${session.sessionNumber}</div><h2 id="dialog-title">${esc(session.title)}</h2><h3>Summary</h3><p>${esc(content.summary || '')}</p><h3>Critical assessment</h3><p>${esc(content.criticalAssessment || '')}</p><h3>Three ideas</h3><ol>${(content.keyIdeas || []).map((item) => `<li>${esc(item)}</li>`).join('')}</ol><h3>Sources</h3><ol>${(session.sources || []).filter((source) => source.url).map((source) => `<li><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)}</a></li>`).join('')}</ol></div>`);
            $('#close').onclick = close;
          }

          function renderChannels"""
          admin, count = preview_book_pattern.subn(preview_book_new, admin, count=1)
          if count != 1:
              raise SystemExit(f'admin book preview replacement count {count}')

          admin_static_replacements = [
            ('<div style="padding:.65rem 0;border-top:1px solid var(--line)">', '<div class="admin-proposal-row">'),
            ('<div class="actions" style="margin-top:6px">', '<div class="actions admin-row-actions">'),
            ('<div class="actions" style="margin-top:10px">', '<div class="actions admin-item-actions">'),
            ('<button style="margin-top:12px">Request pairing code</button>', '<button class="admin-form-submit">Request pairing code</button>'),
            ('<p class="notice warn" style="margin-top:14px">', '<p class="notice warn admin-spaced-notice">'),
            ('<div class="notice warn" style="margin-top:8px">', '<div class="notice warn admin-compact-notice">'),
            ('<div class="list" style="margin-top:12px">', '<div class="list admin-spaced-list">')
          ]
          expected = [1, 1, 1, 1, 1, 2, 1]
          for (old, new), count_expected in zip(admin_static_replacements, expected):
              actual = admin.count(old)
              if actual != count_expected:
                  raise SystemExit(f'admin style anchor count {actual}, expected {count_expected}: {old}')
              admin = admin.replace(old, new)

          if re.search(r'\sstyle\s*=\s*["\']', admin, flags=re.I):
              raise SystemExit('admin asset still emits inline style attributes')

          css_anchor = ".dialog-actions, .dialog-result { margin-block-start: 14px; }\n"
          css_add = """.dialog-actions, .dialog-result { margin-block-start: 14px; }
          .admin-proposal-row { padding: .65rem 0; border-block-start: 1px solid var(--line); }
          .admin-row-actions { margin-block-start: 6px; }
          .admin-dialog-actions, .admin-spaced-list, .admin-form-submit { margin-block-start: 12px; }
          .admin-item-actions { margin-block-start: 10px; }
          .admin-spaced-notice { margin-block-start: 14px; }
          .admin-compact-notice { margin-block-start: 8px; }
          """
          css = replace_once(css, css_anchor, css_add, 'admin CSP-safe spacing classes')

          app_path.write_text(app)
          admin_path.write_text(admin)
          css_path.write_text(css)
          PY
      - name: Verify exact source scope
        if: steps.gate.outputs.apply == 'true'
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "public/admin.js public/app.js public/styles.css "
      - name: Verify full application and dependency audit
        if: steps.gate.outputs.apply == 'true'
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Verify Workspace Agent and dependency audit
        if: steps.gate.outputs.apply == 'true'
        working-directory: automation/workspace-agent
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Commit verified repair
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/admin.js public/styles.css
          git rm .github/frontend-runtime-repair-trigger
          git diff --cached --check
          git commit -m 'fix: harden frontend dialog and CSP runtime behavior [frontend-runtime-repair]'
          git push origin HEAD:audit/comprehensive-hardening

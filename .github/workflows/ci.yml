name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  release-tag-v151:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ops: trigger immutable v1.5.1 tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact immutable v1.5.1 tag
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA='6d47ac847bfac66b636668e03e75a270ee16aeb9'
          TAG='v1.5.1'
          git fetch --prune --prune-tags --tags origin
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          [[ "$(git show "$RELEASE_SHA:VERSION" | tr -d '[:space:]')" == '1.5.1' ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            actual="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            [[ "$actual" == "$RELEASE_SHA" ]] || { echo "Existing tag points to $actual, expected $RELEASE_SHA" >&2; exit 1; }
            echo "$TAG already points to exact release commit"
            exit 0
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          actual="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          [[ "$actual" == "$RELEASE_SHA" ]]

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  accepted-result-repair:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/comprehensive-hardening' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Check one-time repair marker
        run: |
          if [ -f .github/accepted-result-repair-trigger ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Remove redundant accepted-result retention
        if: steps.gate.outputs.apply == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/services/business-actions.js')
          text = path.read_text()
          old = """function completeActiveTask(state, task, resultRef, { submissionDiagnostics = null, acceptedResult = null } = {}) {
            const target = assertActiveTaskContext(state, task);
            target.status = 'completed';
            target.completedAt = nowIso();
            target.claimedAt ||= nowIso();
            target.resultRef = resultRef || null;
            target.error = null;
            target.lastSubmissionError = null;
            target.acceptedSubmission = submissionDiagnostics ? { ...submissionDiagnostics, acceptedAt: nowIso() } : null;
            if (acceptedResult !== null) target.acceptedResult = acceptedResult;
            target.updatedAt = nowIso();
            return target;
          }
          """
          new = """function completeActiveTask(state, task, resultRef, { submissionDiagnostics = null } = {}) {
            const target = assertActiveTaskContext(state, task);
            target.status = 'completed';
            target.completedAt = nowIso();
            target.claimedAt ||= nowIso();
            target.resultRef = resultRef || null;
            target.error = null;
            target.lastSubmissionError = null;
            target.acceptedSubmission = submissionDiagnostics ? { ...submissionDiagnostics, acceptedAt: nowIso() } : null;
            delete target.acceptedResult;
            target.updatedAt = nowIso();
            return target;
          }
          """
          if old not in text:
              raise SystemExit('completeActiveTask anchor not found')
          text = text.replace(old, new, 1)
          old_call = "completeActiveTask(state, task, target.id, { submissionDiagnostics, acceptedResult: result });"
          new_call = "completeActiveTask(state, task, target.id, { submissionDiagnostics });"
          if old_call not in text:
              raise SystemExit('book analysis completion anchor not found')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
      - name: Verify exact source scope
        if: steps.gate.outputs.apply == 'true'
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/services/business-actions.js "
      - name: Verify full application and dependency audit
        if: steps.gate.outputs.apply == 'true'
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Verify Workspace Agent and dependency audit
        if: steps.gate.outputs.apply == 'true'
        working-directory: automation/workspace-agent
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Commit verified repair
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/business-actions.js
          git rm .github/accepted-result-repair-trigger
          git diff --cached --check
          git commit -m 'fix: stop retaining duplicate accepted book payloads [accepted-result-repair]'
          git push origin HEAD:audit/comprehensive-hardening

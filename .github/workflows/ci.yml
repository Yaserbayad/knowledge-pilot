name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  bump-pr15-v152:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 15 && github.event.pull_request.head.ref == 'fix/deploy-lock-fd-inheritance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deploy-lock-fd-inheritance
          fetch-depth: 0
      - name: Bump exact release identity to 1.5.2
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '[:space:]' < VERSION)" == "1.5.1" ]]
          printf '1.5.2\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          changes = [
              ('package.json', '"version": "1.5.1"', '"version": "1.5.2"', 1),
              ('src/version.js', "APP_VERSION = '1.5.1'", "APP_VERSION = '1.5.2'", 1),
              ('public/sw.js', 'knowledge-pilot-shell-v1.5.1', 'knowledge-pilot-shell-v1.5.2', 1),
              ('package-lock.json', '"version": "1.5.1"', '"version": "1.5.2"', 2),
          ]
          for filename, old, new, count in changes:
              path = Path(filename)
              text = path.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{filename}: expected at least {count} occurrence(s) of {old!r}')
              path.write_text(text.replace(old, new, count))
          PY
          rm -f .v152-bump-trigger
          bash -n scripts/deploy-release.sh
          node --test tests/deploy-lock-fd.test.js tests/release-integrity.test.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION package.json package-lock.json src/version.js public/sw.js .v152-bump-trigger
          git commit -m "chore: bump release identity to 1.5.2"
          git push origin HEAD:fix/deploy-lock-fd-inheritance

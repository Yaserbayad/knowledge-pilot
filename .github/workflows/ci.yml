name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  frontend-runtime-repair:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/comprehensive-hardening' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/comprehensive-hardening
          fetch-depth: 0
      - id: gate
        name: Check one-time repair marker
        run: |
          if [ -f .github/frontend-runtime-repair-trigger ] && [ -f .github/frontend-runtime-repair.py ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Apply bounded frontend repair
        if: steps.gate.outputs.apply == 'true'
        run: python3 .github/frontend-runtime-repair.py
      - name: Verify exact source scope
        if: steps.gate.outputs.apply == 'true'
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "public/admin.js public/app.js public/styles.css "
      - name: Verify full application and dependency audit
        if: steps.gate.outputs.apply == 'true'
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Verify Workspace Agent and dependency audit
        if: steps.gate.outputs.apply == 'true'
        working-directory: automation/workspace-agent
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Commit verified repair
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/admin.js public/styles.css
          git rm .github/frontend-runtime-repair-trigger .github/frontend-runtime-repair.py
          git diff --cached --check
          git commit -m 'fix: harden frontend dialog and CSP runtime behavior [frontend-runtime-repair]'
          git push origin HEAD:audit/comprehensive-hardening

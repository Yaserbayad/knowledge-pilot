name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/comprehensive-hardening]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Application checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  workspace-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/workspace-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/workspace-agent/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Workspace Agent checks and tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  release-identity-bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'fix/reading-document-retry-contract'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-document-retry-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bump exact release identity once
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          if [[ "$current" == "1.5.1" ]]; then
            echo "Already 1.5.1"
            exit 0
          fi
          [[ "$current" == "1.5.0" ]] || { echo "Unexpected VERSION=$current" >&2; exit 1; }
          printf '1.5.1\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          changes = [
              ('package.json', '"version": "1.5.0"', '"version": "1.5.1"', 1),
              ('src/version.js', "APP_VERSION = '1.5.0'", "APP_VERSION = '1.5.1'", 1),
              ('public/sw.js', 'knowledge-pilot-shell-v1.5.0', 'knowledge-pilot-shell-v1.5.1', 1),
              ('package-lock.json', '"version": "1.5.0"', '"version": "1.5.1"', 2),
          ]
          for filename, old, new, count in changes:
              path = Path(filename)
              text = path.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{filename}: expected at least {count} occurrence(s) of {old!r}')
              path.write_text(text.replace(old, new, count))
          PY
          node --test tests/release-integrity.test.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION package.json package-lock.json src/version.js public/sw.js
          git commit -m "chore: bump release identity to 1.5.1"
          git push origin HEAD:fix/reading-document-retry-contract

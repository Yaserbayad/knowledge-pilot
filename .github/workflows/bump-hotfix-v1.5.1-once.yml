name: Bump hotfix v1.5.1 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-document-retry-contract
          fetch-depth: 0
      - name: Bump hotfix release identity
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          if [[ "$current" == "1.5.1" ]]; then
            echo "Release identity already 1.5.1; nothing to do."
            exit 0
          fi
          [[ "$current" == "1.5.0" ]] || { echo "Unexpected VERSION=$current" >&2; exit 1; }

          printf '1.5.1\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path

          for name, old, new, count in [
              ('package.json', '"version": "1.5.0"', '"version": "1.5.1"', 1),
              ('src/version.js', "APP_VERSION = '1.5.0'", "APP_VERSION = '1.5.1'", 1),
              ('public/sw.js', 'knowledge-pilot-shell-v1.5.0', 'knowledge-pilot-shell-v1.5.1', 1),
          ]:
              path = Path(name)
              text = path.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{name}: expected {count} occurrence(s) of {old!r}')
              path.write_text(text.replace(old, new, count))

          path = Path('package-lock.json')
          text = path.read_text()
          old = '"version": "1.5.0"'
          if text.count(old) < 2:
              raise SystemExit('package-lock.json: expected at least two 1.5.0 identity entries')
          path.write_text(text.replace(old, '"version": "1.5.1"', 2))
          PY

          node tests/release-identity.test.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION package.json package-lock.json src/version.js public/sw.js
          git commit -m "chore: bump release identity to 1.5.1"
          git push origin HEAD:fix/reading-document-retry-contract

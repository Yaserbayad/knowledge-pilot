name: Create v1.5.0 release tag once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact immutable release tag
        env:
          RELEASE_TAG: v1.5.0
          RELEASE_SHA: efc63a363239804420057e13f6536bc5e5329e3a
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            existing="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            test "$existing" = "$RELEASE_SHA"
            echo "Tag already exists at expected release SHA."
            exit 0
          fi
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Knowledge Pilot 1.5.0"
          git push origin "refs/tags/${RELEASE_TAG}"
